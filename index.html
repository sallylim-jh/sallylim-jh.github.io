<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sally Lim | MYA | MaritimeONE Scholar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .profile-img {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .badge {
            font-size: 1.1rem;
            font-weight: 500;
            color: #2563eb;
            margin-bottom: 0.75rem;
        }

        .description {
            font-size: 1rem;
            color: #334155;
            margin-bottom: 1.5rem;
            border-left: 3px solid #2563eb;
            padding-left: 1rem;
        }

        .links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        hr {
            margin: 2rem 0 1rem;
            border: none;
            border-top: 1px solid #e2e8f0;
        }

        .contact-note {
            font-size: 0.9rem;
            color: #475569;
            margin-top: 1.5rem;
            background: #f1f5f9;
            padding: 0.75rem;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile picture - uses profile.jpg from the same folder -->
        <img class="profile-img" src="profile.jpg" alt="Sally Lim">

        <h1>Sally Lim</h1>
        <div class="badge">MYA | MaritimeONE Scholar</div>
        <div class="description">
            Final Year Maritime BSc Student at Nanyang Technological University, Singapore<br>
            Currently seeking trainee commercial roles.
        </div>

        <div class="links">
            <a href="https://linkedin.com/in/sallylim-jh" target="_blank" rel="noopener noreferrer">
                📄 LinkedIn
            </a>
            <a href="mailto:hello@sallylim.com">
                ✉️ Email me
            </a>
        </div>

        <hr>

        <div class="contact-note">
            📬 Reach me at <strong>hello@sallylim.com</strong> or connect on LinkedIn.
        </div>
    </div>
</body>
</html>
